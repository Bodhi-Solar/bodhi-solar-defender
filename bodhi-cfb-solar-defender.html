* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: monospace;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#gameContainer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#scanlines {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px);
  z-index: 10;
}
#crtOverlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
  border-radius: 6px;
  z-index: 11;
}
/* Portrait rotation message — mobile only */
#rotateMsg {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: #000;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 200;
  color: #FFD110;
  text-align: center;
  padding: 20px;
  font-family: monospace;
}
#rotateMsg span { font-size: 52px; display: block; margin-bottom: 16px; }
#rotateMsg p { font-size: 16px; color: #FF6F47; }
/* Only show rotate message on narrow portrait screens (phones) */
@media (orientation: portrait) and (max-width: 600px) {
  #rotateMsg { display: flex !important; }
  #gameContainer { display: none !important; }
}
#nameInput {
  position: absolute; top: 0; left: 0;
  width: 1px; height: 1px;
  opacity: 0; pointer-events: none;
}
/* Mobile touch zone hints — only shown briefly at start */
#touchHints {
  display: none;
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
}

<body>
<div id="rotateMsg">
  <span>📱↔️</span>
  <p>Please rotate your phone<br>to landscape mode to play</p>
</div>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="scanlines"></div>
  <div id="crtOverlay"></div>
  <input id="nameInput" type="text" maxlength="10" autocomplete="off" />
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const nameInput = document.getElementById('nameInput');

// ── Internal game resolution (fixed) ──────────────────────────────────────────
const GW = 1024, GH = 640;
canvas.width = GW; canvas.height = GH;

// ── Detect touch device ────────────────────────────────────────────────────────
let isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// ── Responsive scaling ─────────────────────────────────────────────────────────
function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  const scale = Math.min(sw / GW, sh / GH);
  canvas.style.width  = Math.floor(GW * scale) + 'px';
  canvas.style.height = Math.floor(GH * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => { setTimeout(resize, 120); });

// Helper: convert a client touch position into canvas (game) coordinates
function clientToGame(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (GW / rect.width),
    y: (clientY - rect.top)  * (GH / rect.height)
  };
}

canvas.addEventListener('touchstart', e => {

    const pos = clientToGame(t.clientX, t.clientY);

    if (state === 'playing') {
      if (pos.x >= W * 0.6) {
        touchShoot = { id: t.identifier };
      } else {
        touchMove = {
          id: t.identifier,

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}
function playTone(f, d, tp, v, t) {
  try {
    let ac = getAudioCtx(), o = ac.createOscillator(), g = ac.createGain();
    o.type = tp || 'square';
    o.frequency.setValueAtTime(f, t || ac.currentTime);
    g.gain.setValueAtTime(v || 0.08, t || ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, (t || ac.currentTime) + d);
    o.connect(g); g.connect(ac.destination);
    o.start(t || ac.currentTime); o.stop((t || ac.currentTime) + d);
  } catch(e) {}
}

}

function startMusic(lvl) {
  stopMusic(); musicPlaying = true; musicStep = 0;
  let tempo = 120 / Math.pow(1.25, lvl - 1);
  musicInterval = setInterval(() => {
    if (!musicPlaying) return;
    let ac = getAudioCtx(), t = ac.currentTime;
    let mel = melodyA[musicStep % melodyA.length], bas = bassA[musicStep % bassA.length], arp = arpA[musicStep % arpA.length];

  let X=Math.floor(b.x),Y=Math.floor(b.y),t=b.t,fl=Math.sin(t*0.8)*0.15+Math.sin(t*1.7)*0.1;
  ctx.globalAlpha=0.2+fl;ctx.fillStyle=GOLD;ctx.fillRect(X-8,Y-8,58,68);ctx.globalAlpha=1;
  let sg=[{x:18,y:0,w:10,h:6},{x:22,y:4,w:8,h:5},{x:14,y:8,w:12,h:5},{x:8,y:12,w:14,h:4},{x:2,y:15,w:38,h:6},{x:20,y:20,w:10,h:5},{x:26,y:24,w:8,h:5},{x:16,y:28,w:14,h:5},{x:10,y:32,w:12,h:5},{x:18,y:36,w:8,h:5},{x:22,y:40,w:6,h:5},{x:20,y:44,w:4,h:5}];
  sg.forEach(s=>{px(X+s.x-1,Y+s.y-1,s.w+2,s.h+2,'rgba(100,180,255,0.4)');});
  sg.forEach(s=>{px(X+s.x,Y+s.y,s.w,s.h,GOLD);});
  sg.forEach(s=>{px(X+s.x+2,Y+s.y+1,Math.max(2,s.w-4),Math.max(2,s.h-2),'#FFF');});
  let sp=Math.floor(t/3)%4;
  if(sp===0){px(X+2,Y+14,6,3,'#AAD4FF');px(X+36,Y+16,6,3,'#AAD4FF');}
  if(sp===1){px(X+6,Y+10,4,3,'#88BBFF');px(X+32,Y+20,5,3,'#88BBFF');}
  if(sp===2){px(X+28,Y+12,6,2,GOLD);px(X+8,Y+30,5,3,GOLD);}
  if(sp===3){px(X+4,Y+18,5,2,'#FFF');px(X+34,Y+26,4,3,'#FFF');}
  for(let i=0;i<3;i++){let sx=X+10+Math.sin(t*0.5+i*2.1)*16,sy=Y+10+Math.cos(t*0.7+i*1.8)*18,sz=2+(Math.floor(t+i)%2);ctx.fillStyle=i%2===0?'#FFF':'#AAD4FF';ctx.fillRect(Math.floor(sx),Math.floor(sy),sz,sz);}
}
function drawLaser(l){const S=PLAYER_STYLES[l.owner||0];px(l.x,l.y,20,5,S.laserA);px(l.x+3,l.y+1,14,3,S.laserB);px(l.x+16,l.y+1,6,3,'#FFF');}

function drawSolarOrb(o){
  let t=o.t,pulse=Math.sin(t*0.15)*4;
  ctx.globalAlpha=0.2+Math.sin(t*0.1)*0.1;ctx.fillStyle='#FFE866';
  ctx.beginPath();ctx.arc(o.x+12,o.y+12,16+pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(o.x+12,o.y+12,12,0,Math.PI*2);ctx.fillStyle='#FF8C00';ctx.fill();
  ctx.beginPath();ctx.arc(o.x+12,o.y+12, 9,0,Math.PI*2);ctx.fillStyle='#FFC200';ctx.fill();
  ctx.beginPath();ctx.arc(o.x+12,o.y+12, 6,0,Math.PI*2);ctx.fillStyle='#FFE866';ctx.fill();
  ctx.beginPath();ctx.arc(o.x+12,o.y+12, 3,0,Math.PI*2);ctx.fillStyle='#FFF';ctx.fill();
  ctx.save();ctx.translate(o.x+12,o.y+12);ctx.rotate(t*0.08);
  ctx.globalAlpha=0.7;ctx.fillStyle='#FFD110';
  for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*Math.PI/3);ctx.fillRect(-1.5,-15,3,5);ctx.restore();}
  ctx.globalAlpha=1;ctx.restore();
}

function drawBird(b){
  let X=Math.floor(b.x),Y=Math.floor(b.y),flap=Math.sin(b.t*0.3)*3;
  px(X+4,Y+4,10,6,'#FFDD55');px(X+2,Y+5,4,4,'#FFEE88');
  if(flap>0){px(X,Y+2,5,3,'#FFDD55');px(X+12,Y+2,5,3,'#FFDD55');}
  else{px(X+1,Y+6,4,2,'#FFDD55');px(X+13,Y+6,4,2,'#FFDD55');}
  px(X+12,Y+2,6,6,'#FFDD55');px(X+17,Y+4,4,2,'#FF9900');
  px(X+14,Y+3,2,2,'#222');px(X,Y+5,3,3,'#FFCC00');
}

function drawFlowers(){
  if(!flowersActive||panelFlowers.length===0)return;
  let alpha=Math.min(1,flowerTimer/60)*Math.min(1,(flowerTimer>500?(700-flowerTimer)/200:1));
  ctx.globalAlpha=alpha;
  for(let f of panelFlowers){
    let sx=((f.worldX - scrollX*0.5)%(W+600)+W+600)%(W+600)-300;
    if(sx<-60||sx>W+60)continue;
    let sc=f.scale*(0.5+Math.min(1,flowerTimer/80)*0.5);
    let X=Math.floor(sx), Y=GROUND_Y;
    let stemH=Math.floor(f.stemH*sc);
    let ps=Math.floor(f.petalSize*sc);
    ctx.fillStyle='#3d8830';ctx.fillRect(X,Y-stemH,3,stemH);
    let cx=X+1,cy=Y-stemH-ps;
    ctx.fillStyle=f.color;
    ctx.fillRect(cx-ps*2,cy-ps,ps,ps);ctx.fillRect(cx+ps,cy-ps,ps,ps);
    ctx.fillRect(cx-ps,cy-ps*3,ps,ps);ctx.fillRect(cx,cy-ps*3,ps,ps);
    ctx.fillRect(cx-ps,cy+ps,ps,ps);ctx.fillRect(cx,cy+ps,ps,ps);
    ctx.fillStyle='#FFD110';ctx.fillRect(cx-ps/2|0,cy-ps,ps+1,ps+1);
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect((cx-ps/2|0)+1,cy-ps+1,Math.max(2,ps-2),Math.max(2,ps-2));
  }
  ctx.globalAlpha=1;
}

// ── SUN ────────────────────────────────────────────────────────────────────────
function drawSun(){
  let sx=900,sy=80,r=90,b=sunBrightness;
  ctx.globalAlpha=0.2*b;ctx.fillStyle=GOLD;
  for(let i=0;i<12;i++){let a=(Date.now()/2000)+i*Math.PI/6;ctx.save();ctx.translate(sx,sy);ctx.rotate(a);ctx.fillRect(-5,-r-45,10,45);ctx.restore();}
  ctx.globalAlpha=0.1*b;
  for(let i=0;i<12;i++){let a=(Date.now()/3000)+i*Math.PI/6+0.26;ctx.save();ctx.translate(sx,sy);ctx.rotate(a);ctx.fillRect(-3,-r-60,6,35);ctx.restore();}
  ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fillStyle=`rgba(255,209,16,${b})`;ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,r-22,0,Math.PI*2);ctx.fillStyle=`rgba(255,240,100,${b})`;ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,r-44,0,Math.PI*2);ctx.fillStyle=`rgba(255,250,200,${b*0.7})`;ctx.fill();
  if(b<1){ctx.beginPath();ctx.arc(sx,sy,r+12,0,Math.PI*2);ctx.fillStyle=`rgba(30,30,50,${(1-b)*0.6})`;ctx.fill();}
}

// ── BACKGROUNDS ────────────────────────────────────────────────────────────────
function drawSky(){
  let grad=ctx.createLinearGradient(0,0,0,H);
  if(level===1){grad.addColorStop(0,'#1E88CC');grad.addColorStop(0.3,'#3399DD');grad.addColorStop(0.6,'#55BBEE');grad.addColorStop(1,'#77DDFF');}
  else if(level===2){grad.addColorStop(0,'#2080CC');grad.addColorStop(0.3,'#3898DD');grad.addColorStop(0.6,'#50B0EE');grad.addColorStop(1,'#70CCFF');}
  else{grad.addColorStop(0,'#2288DD');grad.addColorStop(0.3,'#44AAEE');grad.addColorStop(0.6,'#66CCFF');grad.addColorStop(1,'#88DDFF');}
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.55)';
  let cc=level===3?7:5;
  for(let i=0;i<cc;i++){
    let cx=((i*195+40)-scrollX*0.08)%(W+250)-125,cy=30+(i%3)*35;
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+24,cy-6,25,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+50,cy,18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+22,cy+10,16,0,Math.PI*2);ctx.fill();
  }
}
function drawGrassland(sx){
  ctx.fillStyle='#4aA040';ctx.beginPath();ctx.moveTo(0,GROUND_Y+10);
  for(let i=0;i<=W;i+=5){let h=Math.sin((i+sx*0.3)/120)*15+Math.sin((i+sx*0.2)/60)*8;ctx.lineTo(i,GROUND_Y-5+h);}
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle='#3d8830';ctx.fillRect(0,GROUND_Y+20,W,H-GROUND_Y-20);
  for(let i=0;i<30;i++){let gx=((i*45+10)-sx*0.5)%(W+100)-50,gy=GROUND_Y-8+(i%3)*6;px(gx,gy,3,10,'#5ab84a');px(gx+5,gy+2,3,8,'#4a9d3a');px(gx-4,gy+1,3,9,'#6ac85a');}
  for(let i=0;i<12;i++){let fx=((i*95+30)-sx*0.3)%(W+80)-40;ctx.fillStyle=[GOLD,ORANGE,'#FF88AA','#88DDFF'][i%4];ctx.fillRect(fx,GROUND_Y-10,6,6);ctx.fillStyle='#4aA040';ctx.fillRect(fx+2,GROUND_Y-4,2,8);}
}
function drawMountains(sx){
  ctx.fillStyle='#3A6A8C';for(let i=0;i<8;i++){let mx=((i*180)-sx*0.12)%(W+500)-250;ctx.beginPath();ctx.moveTo(mx,GROUND_Y);ctx.lineTo(mx+120,200+(i%3)*60);ctx.lineTo(mx+240,GROUND_Y);ctx.fill();}
  ctx.fillStyle='#2A5A7A';for(let i=0;i<7;i++){let mx=((i*200+80)-sx*0.25)%(W+500)-250;ctx.beginPath();ctx.moveTo(mx,GROUND_Y);ctx.lineTo(mx+90,280+(i%2)*50);ctx.lineTo(mx+180,GROUND_Y);ctx.fill();}
  for(let i=0;i<7;i++){let mx=((i*200+80)-sx*0.25)%(W+500)-250;let pk=280+(i%2)*50;ctx.fillStyle='#FFFAF0';ctx.beginPath();ctx.moveTo(mx+60,pk+18);ctx.lineTo(mx+90,pk);ctx.lineTo(mx+120,pk+18);ctx.fill();}
  ctx.fillStyle='#3A7A4A';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);ctx.fillStyle='#2E6A3E';ctx.fillRect(0,GROUND_Y+30,W,H-GROUND_Y-30);
  for(let i=0;i<16;i++){let tx=((i*75+20)-sx*0.4)%(W+200)-100;ctx.fillStyle='#2A5A30';ctx.fillRect(tx+8,GROUND_Y-18,4,18);ctx.fillStyle='#3D7A3A';ctx.beginPath();ctx.moveTo(tx,GROUND_Y-10);ctx.lineTo(tx+10,GROUND_Y-35);ctx.lineTo(tx+20,GROUND_Y-10);ctx.fill();ctx.beginPath();ctx.moveTo(tx+2,GROUND_Y-20);ctx.lineTo(tx+10,GROUND_Y-42);ctx.lineTo(tx+18,GROUND_Y-20);ctx.fill();}
}
function drawCity(sx){
  let bC=['#556677','#667788','#5A6A7A','#6B7B8B','#4A5A6A','#7A8A9A','#506070'];
  for(let i=0;i<14;i++){let bx=((i*100+15)-sx*0.1)%(W+400)-200;let bh=130+(i*47%120);ctx.fillStyle=bC[(i+2)%bC.length];ctx.fillRect(bx,GROUND_Y-bh,45,bh);
    for(let wy=GROUND_Y-bh+10;wy<GROUND_Y-5;wy+=12){for(let wx=bx+5;wx<bx+40;wx+=10){if(Math.random()>0.3){ctx.fillStyle=Math.random()>0.5?'#AAE0FF':'#CCF0FF';ctx.globalAlpha=0.5+Math.random()*0.4;ctx.fillRect(wx,wy,4,5);ctx.globalAlpha=1;}}}}
  for(let i=0;i<16;i++){let bx=((i*70+40)-sx*0.25)%(W+350)-175;let bh=80+(i*37%140);ctx.fillStyle=bC[i%bC.length];ctx.fillRect(bx,GROUND_Y-bh,60,bh);ctx.fillStyle='#8899AA';ctx.fillRect(bx+2,GROUND_Y-bh,56,3);
    for(let wy=GROUND_Y-bh+10;wy<GROUND_Y-5;wy+=14){for(let wx=bx+6;wx<bx+54;wx+=12){if(Math.random()>0.3){ctx.fillStyle=Math.random()>0.6?'#AAE0FF':'#CCF0FF';ctx.globalAlpha=0.5+Math.random()*0.4;ctx.fillRect(wx,wy,5,6);ctx.globalAlpha=1;}}}}
  ctx.fillStyle='#777';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);ctx.fillStyle='#666';ctx.fillRect(0,GROUND_Y+30,W,H-GROUND_Y-30);
  ctx.fillStyle=GOLD;for(let i=0;i<25;i++){let lx=((i*55)-sx*0.5)%(W+120)-60;ctx.fillRect(lx,GROUND_Y+50,28,3);}
  ctx.fillStyle='#999';ctx.fillRect(0,GROUND_Y,W,6);
}
function drawBackground(sx){drawSky();drawSun();let bg=levels[level-1].bg;if(bg==='grassland')drawGrassland(sx);else if(bg==='mountains')drawMountains(sx);else drawCity(sx);}

function drawSolarPanels(){
  for(let i=0;i<solarPanels.length;i++){
    let sp=solarPanels[i],sx=sp.worldX-scrollX*0.5,ww=W+500;

// ── PARTICLES ──────────────────────────────────────────────────────────────────
function spawnExplosion(x,y){for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=1.5+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*18,maxLife:38,color:[ORANGE,GOLD,'#FF4444','#FFF',ORANGE_LIGHT][Math.floor(Math.random()*5)],size:3+Math.random()*6});}}
function spawnFloatingText(x,y,text,color,life){life=life||60;floatingTexts.push({x,y,text,color:color||GOLD,life,maxLife:life,vy:-1.2*60/life});}
function spawnCelebration(){celebrationParticles=[];for(let i=0;i<100;i++){celebrationParticles.push({x:W/2+(Math.random()-0.5)*400,y:H+10,vx:(Math.random()-0.5)*5,vy:-3-Math.random()*6,life:60+Math.random()*60,maxLife:120,color:[GOLD,ORANGE,'#FFF',ORANGE_LIGHT,'#88DDFF','#FF88AA'][Math.floor(Math.random()*6)],size:3+Math.random()*6,gravity:0.03});}}
function spawnFirework(x,y){let cs=[GOLD,ORANGE,'#FF88AA','#88DDFF','#FFF',ORANGE_LIGHT,'#88FF88'],c=cs[Math.floor(Math.random()*cs.length)];for(let i=0;i<30;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4;victoryFireworks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*30,maxLife:60,color:c,size:2+Math.random()*4,gravity:0.04});}}
function updateCelebrationParticles(){for(let i=celebrationParticles.length-1;i>=0;i--){let p=celebrationParticles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.life--;if(p.life<=0)celebrationParticles.splice(i,1);}}
function drawCelebrationParticles(){celebrationParticles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/p.maxLife*2);ctx.fillStyle=p.color;ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.size,p.size);});ctx.globalAlpha=1;}
function updateFireworks(){for(let i=victoryFireworks.length-1;i>=0;i--){let p=victoryFireworks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=0.98;p.life--;if(p.life<=0)victoryFireworks.splice(i,1);}}
function drawFireworks(){victoryFireworks.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/p.maxLife*2);ctx.fillStyle=p.color;ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.size,p.size);});ctx.globalAlpha=1;}

// ── HUD ────────────────────────────────────────────────────────────────────────
function drawHUD(){
  // Power meter (vertical bar, left side) - shared by the whole team
  ctx.fillStyle='rgba(0,20,45,0.85)';ctx.fillRect(10,60,40,280);
  ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.strokeRect(10,60,40,280);
  let mH=(powerMeter/10)*274,gr=ctx.createLinearGradient(0,338-mH,0,338);
  gr.addColorStop(0,GOLD);gr.addColorStop(1,ORANGE);
  ctx.fillStyle=gr;ctx.fillRect(12,338-mH,36,mH);
  for(let i=1;i<10;i++){ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(12,338-(i/10)*274,36,1);}
  ctx.fillStyle=GOLD;ctx.font='bold 11px monospace';ctx.textAlign='center';
  if(numPlayers>1) ctx.fillText('TEAM',30,42);
  ctx.fillText('POWER',30,55);ctx.fillText(powerMeter+'/10',30,355);
  if(numPlayers===1){
    const p=players[0];
    // Lives
    ctx.fillStyle='#FFF';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.fillText('LIVES',10,380);
    for(let i=0;i<p.lives;i++){px(10+i*18,388,14,14,ORANGE);px(12+i*18,390,10,10,GOLD);}
    // Score
    ctx.fillStyle='#000';ctx.font='bold 16px monospace';ctx.textAlign='right';ctx.fillText('SCORE: '+p.score,W-20,30);
  } else {
    drawPlayerPanel(players[0], 62, 8);
    drawPlayerPanel(players[1], W-302, 8);
  }
  ctx.textAlign='center';ctx.fillStyle=ORANGE;ctx.font='bold 16px monospace';ctx.fillText('LEVEL '+level+': '+levels[level-1].name,W/2,30);
  // Controls hint (adapts to input device)
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='11px monospace';ctx.textAlign='right';
  if (padActive) ctx.fillText('START: PAUSE  |  SELECT (-): EXIT',W-12,H-12);
  else if (!isTouchDevice) ctx.fillText('P: PAUSE  |  ESC: EXIT',W-12,H-12);
}

// One score card per player in 2-player mode
function drawPlayerPanel(p, x, y){
  const S=PLAYER_STYLES[p.id], lead=numPlayers>1 && p.score>0 && players.every(q=>q===p||p.score>q.score);
  ctx.fillStyle='rgba(0,20,45,0.82)';ctx.fillRect(x,y,240,46);
  ctx.strokeStyle=S.ui;ctx.lineWidth=2;ctx.strokeRect(x,y,240,46);
  ctx.textAlign='left';ctx.fillStyle=S.ui;ctx.font='bold 14px monospace';
  ctx.fillText(S.tag+' '+S.name+(lead?' ★':''),x+8,y+18);
  ctx.textAlign='right';ctx.fillStyle='#FFF';ctx.font='bold 17px monospace';
  ctx.fillText(p.score,x+232,y+19);
  if(p.alive){
    for(let i=0;i<p.lives;i++){px(x+8+i*16,y+27,12,12,S.cape);px(x+10+i*16,y+29,8,8,S.skin);}
    if(p.triple){ctx.textAlign='right';ctx.fillStyle='#FFC200';ctx.font='bold 12px monospace';ctx.fillText('⚡x3 '+Math.ceil(p.tripleTimer/60)+'s',x+232,y+39);}
  } else {
    ctx.textAlign='left';ctx.fillStyle=Math.sin(Date.now()/200)>0?'#FF6B6B':'#FFFFFF';ctx.font='bold 11px monospace';
    ctx.fillText('DOWN! TEAMMATE: GRAB '+(3-p.reviveBolts)+' ⚡',x+8,y+38);
  }
}

// ── MOBILE TOUCH ZONE OVERLAY ──────────────────────────────────────────────────
function drawTouchZones(){
  if (!isTouchDevice) return;
  // Fade out after 300 frames, never show after that
  if (touchHintTimer > 300) return;
  let alpha = touchHintTimer < 200 ? 0.22 : 0.22 * (1 - (touchHintTimer - 200) / 100);
  ctx.globalAlpha = alpha;
  // Move zone (left 60%)
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(0, 32, W * 0.6, GROUND_Y - 32);
  ctx.globalAlpha = alpha * 1.2;
  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('DRAG TO MOVE', W * 0.3, GROUND_Y - 16);
  // Shoot zone (right 40%)
  ctx.fillStyle = 'rgba(255,111,71,0.08)';
  ctx.fillRect(W * 0.6, 32, W * 0.4, GROUND_Y - 32);
  ctx.fillStyle = ORANGE;
  ctx.fillText('TAP & HOLD TO SHOOT', W * 0.8, GROUND_Y - 16);
  // Divider line
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(W * 0.6 - 1, 32, 2, GROUND_Y - 32);
  ctx.globalAlpha = 1;
}

const modeBtns = [ { x: W/2-250, y: 250, w: 240, h: 112 }, { x: W/2+10, y: 250, w: 240, h: 112 } ];

  ctx.strokeStyle=ORANGE; ctx.lineWidth=1; ctx.strokeRect(167,45,690,550);
  ctx.textAlign='center';
  // Co-branded title: BODHI (gold) + CLIMATE FIRST BANK (CFB Sky)

function collides(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function resetLevel(){
  enemies=[];lasers=[];bolts=[];particles=[];solarPanels=[];celebrationParticles=[];floatingTexts=[];
  powerMeter=0;enemyTimer=0;boltTimer=0;
  players.forEach(p=>{ p.x=100; p.y=startY(p.id); p.invincible=0; p.triple=false; p.tripleTimer=0; p.levelScore=0; p.shootCooldown=0; p.lastBolt=-9999; });
  sunBrightness=1;screenDim=0;nextPanelX=60;
  solarOrbs=[];solarOrbTimer=0;
  bird=null;birdTimer=0;birdUsed=false;flowersActive=false;flowerTimer=0;panelFlowers=[];
  touchHintTimer=0;
}

function addToLeaderboard(name, sc, pi) {
  // Optimistically add locally for instant feedback
  newEntries.push({ name: name || 'ANON', score: sc, pi: pi || 0 });
  leaderboard.push({ name: name || 'ANON', score: sc, isNew: true, pi: pi || 0 });
  leaderboard.sort((a,b) => b.score - a.score);
  if (leaderboard.length > 10) leaderboard.length = 10;
  // Then persist to Supabase (async, non-blocking)
  submitScore(name, sc);
}

// ── UPDATE ─────────────────────────────────────────────────────────────────────
function update(dt=1){
  // ---- Title: pick 1 or 2 players ----
  if(state==='title'){
    stopMusic();
    if(hit('ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS') || padNav()) modeSel=1-modeSel;
    if(padCount>1 && padSlotTouched(1)) modeSel=1;     // a second controller wants in
    if(hit('Space','Enter') || padConfirm()) startGame(modeSel+1);
    return;
  }

  // ---- Level complete ----
  if(state==='levelComplete'){
    updateCelebrationParticles();
    if(levelTransitionTimer%15===0&&levelTransitionTimer>20){
      for(let i=0;i<6;i++) celebrationParticles.push({x:100+Math.random()*800,y:H+5,vx:(Math.random()-0.5)*3,vy:-4-Math.random()*5,life:50+Math.random()*40,maxLife:90,color:[GOLD,ORANGE,'#FFF','#88DDFF'][Math.floor(Math.random()*4)],size:3+Math.random()*5,gravity:0.03});
    }
    levelTransitionTimer-=dt;
    if(levelTransitionTimer<=0){
      if(level>=3){ state='victory';victoryTimer=0;victoryFireworks=[];playSfx('victory');stopMusic(); }
      else {
        level++; resetLevel();
        // +1 life for everyone still standing; downed heroes come back for the next level
        players.forEach(p=>{ if(p.alive) p.lives++; else { p.alive=true; p.lives=2; p.reviveBolts=0; p.invincible=120; } });
        state='playing'; startMusic(level);
      }
    }
    return;
  }

  // ---- Victory ----
  if(state==='victory'){
    victoryTimer+=dt;updateFireworks();
    if(victoryTimer%25===0) spawnFirework(100+Math.random()*800,80+Math.random()*250);
    if(victoryTimer%40===0) spawnFirework(200+Math.random()*600,60+Math.random()*200);
    if(victoryTimer>=240) startNameEntry();
    return;
  }

  // ---- Leaderboard / name entry ----
  if(state==='leaderboard'){
    if(!nameEntered){
      if(padActive){
        if(!padName) startPadName();
        padNameStep();
      } else if(!isTouchDevice){
        if(document.activeElement!==nameInput) nameInput.focus();
        if(hit('Enter')) confirmNameEntry();
      }
    } else if(hit('Space','Enter') || padConfirm()){
      state='title';
    }
    return;
  }

  // ---- Game Over (short pause so button-mashing doesn't skip the results) ----
  if(state==='gameOver'){
    stopMusic(); stateTimer+=dt;
    if(stateTimer>45 && (hit('Space','Enter') || padConfirm())) startNameEntry();
    return;
  }

  // ---- Paused ----
  if(state==='paused'){
    if(hit('ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS') || padNav()) pauseSel=1-pauseSel;
    if(padEdgeAll.start || hit('KeyP')) { resumeGame(); return; }
    if(hit('Space','Enter') || padEdgeAll.a) { if(pauseSel===0) resumeGame(); else quitToTitle(); }
    return;
  }

  // ---- Playing ----
  if(state==='playing' && (padEdgeAll.start || hit('KeyP'))) { pauseGame(); return; }
  gameTime++;
  if(state==='playing') touchHintTimer++;

  // Heroes: move & shoot
  players.forEach(p=>{
    if(!p.alive) return;
    const inp=playerInput(p.id);
    if(inp.up)    p.y -= p.speed * dt;
    if(inp.down)  p.y += p.speed * dt;
    if(inp.left)  p.x -= p.speed * dt;
    if(inp.right) p.x += p.speed * dt;
    p.x = Math.max(5, Math.min(W-p.w-5, p.x));
    p.y = Math.max(5, Math.min(GROUND_Y-p.h-20, p.y));
    p.shootCooldown -= dt;
    const wantsShoot = inp.fire || (p.id===0 && touchShoot!==null);
    if(wantsShoot && p.shootCooldown<=0){
      if(p.triple){
        lasers.push({x:p.x+90,y:p.y+18,w:20,h:5,vy:0,owner:p.id});
        lasers.push({x:p.x+80,y:p.y+10,w:20,h:5,vy:-1.8,owner:p.id});
        lasers.push({x:p.x+80,y:p.y+26,w:20,h:5,vy:1.8,owner:p.id});
      } else {
        lasers.push({x:p.x+90,y:p.y+18,w:20,h:5,vy:0,owner:p.id});
      }
      p.shootCooldown=12;playSfx('shoot');
    }
    if(p.triple){ p.tripleTimer-=dt; if(p.tripleTimer<=0) p.triple=false; }
    if(p.invincible>0) p.invincible-=dt;
  });

  scrollX += scrollSpeed * dt;
  let cfg = levels[level-1];
  const mobileHard = isTouchDevice ? 0.5 : 1.0;
  const teamHard = numPlayers>1 ? 0.7 : 1.0;   // more fossil fuels when two heroes are flying
  const textColor = p => numPlayers>1 ? PLAYER_STYLES[p.id].ui : null;

  // Enemies
  // Levels can set an exact 2-player spawn rate (teamEnemyInterval); otherwise 2P uses the 0.7 multiplier
  const teamExact = numPlayers>1 && cfg.teamEnemyInterval;
  const enemyEvery = (teamExact ? cfg.teamEnemyInterval : cfg.enemyInterval * teamHard) * mobileHard;
  enemyTimer+=dt; if(enemyTimer>=enemyEvery){ spawnEnemy(); enemyTimer = teamExact ? enemyTimer-enemyEvery : 0; }

  // Bolts
  let boltInterval = cfg.itemInterval * (level>=2 ? 2.4 : 1.2);
  boltTimer+=dt; if(boltTimer>=boltInterval){ spawnBolt();boltTimer=0; }

  // Solar orb
  solarOrbTimer+=dt; let orbInterval=cfg.itemInterval*12*(numPlayers>1?0.7:1); if(solarOrbTimer>=orbInterval){ spawnSolarOrb();solarOrbTimer=0; }

  // Bird easter egg
  if(level===2&&!bird&&!birdUsed){ birdTimer+=dt; if(birdTimer>600+Math.random()*400){ spawnBird();birdTimer=0; } }

  // Flower timer
  if(flowersActive){ flowerTimer+=dt; if(flowerTimer>700){ flowersActive=false;panelFlowers=[];flowerTimer=0; } }

  // Laser movement
  for(let i=lasers.length-1;i>=0;i--){
    lasers[i].x += 8 * dt;
    if(lasers[i].vy) lasers[i].y += lasers[i].vy * dt;
    if(lasers[i].x>W+30) lasers.splice(i,1);
  }

  // Enemy movement & laser hit (points go to whoever fired the laser)
  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i]; e.t+=dt;
    if(e.allDir){
      e.x += e.vx * dt; e.y += e.vy * dt;
      if(e.y<5){e.y=5;e.vy=Math.abs(e.vy);}
      if(e.y>GROUND_Y-60){e.y=GROUND_Y-60;e.vy=-Math.abs(e.vy);}
      if(e.x<-80||e.x>W+80||e.y<-80||e.y>H+80){enemies.splice(i,1);continue;}
    } else {
      e.x -= e.speed * dt; e.y += (e.vy||0) * dt;
      if(e.type==='smoke') e.y += Math.sin(e.t/15)*0.7*dt;
      if(e.y<5){e.y=5;if(e.vy)e.vy=Math.abs(e.vy);}
      if(e.y>GROUND_Y-60){e.y=GROUND_Y-60;if(e.vy)e.vy=-Math.abs(e.vy);}
      if(e.x<-70){enemies.splice(i,1);continue;}
    }
    for(let j=lasers.length-1;j>=0;j--){
      if(collides(lasers[j],e)){
        const shooter=players[lasers[j].owner]||players[0];
        let pts=level===1?25:level===2?50:75;
        addScore(shooter,pts); shooter.kills++;
        spawnExplosion(e.x+28,e.y+28);spawnFloatingText(e.x+28,e.y+28,'+'+pts,textColor(shooter)||ORANGE);playSfx('explode');
        enemies.splice(i,1);lasers.splice(j,1);break;
      }
    }
  }

  // Energy bolt pickup
  for(let i=bolts.length-1;i>=0;i--){
    let b=bolts[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.t+=dt;
    if(b.y>H||b.x<-50||b.y<-50){bolts.splice(i,1);continue;}
    const p=players.find(q=>q.alive && collides(heroBox(q),b));
    if(!p) continue;
    powerMeter=Math.min(10,powerMeter+1);addScore(p,100);addSolarPanel();
    spawnFloatingText(b.x+21,b.y+24,'+100',textColor(p)||GOLD);
    screenDim=Math.max(0,screenDim-0.15);playSfx('collect');
    for(let k=0;k<8;k++) particles.push({x:b.x+21,y:b.y+24,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:18,maxLife:18,color:GOLD,size:4});
    bolts.splice(i,1);
    const mate=players.find(q=>q!==p && !q.alive);
    if(mate){
      // Teammate is down: every bolt counts toward bringing them back
      mate.reviveBolts++;
      if(mate.reviveBolts>=3) reviveTeammate(mate,p);
      else spawnFloatingText(p.x+48,p.y-16,'REVIVE '+PLAYER_STYLES[mate.id].tag+' '+mate.reviveBolts+'/3',PLAYER_STYLES[mate.id].ui,90);
    } else if(numPlayers>1){
      // SOLAR SYNC: both heroes grab energy within 1.5 seconds of each other
      const other=players.find(q=>q!==p);
      if(other && other.alive && gameTime-other.lastBolt<=90){
        addScore(p,150); addScore(other,150); other.lastBolt=-9999; p.lastBolt=-9999;
        spawnFloatingText(W/2,140,'☀ SOLAR SYNC! +150 EACH ☀','#FFE866',100);
      } else p.lastBolt=gameTime;
    }
    if(powerMeter>=10){
      let bonus=level>=3?1000:500;
      players.forEach(q=>{ if(q.alive) addScore(q,bonus); });
      state='levelComplete';levelTransitionTimer=180;playSfx('levelup');spawnCelebration();stopMusic();
      break;
    }
  }

  // Solar orb pickup (triple cannon for whoever grabs it)
  for(let i=solarOrbs.length-1;i>=0;i--){
    let o=solarOrbs[i]; o.x += o.vx * dt; o.y += o.vy * dt; o.t+=dt;
    if(o.y>H||o.x<-60||o.y<-60){solarOrbs.splice(i,1);continue;}
    const p=players.find(q=>q.alive && collides(heroBox(q),o));
    if(p){
      p.triple=true;p.tripleTimer=300;addScore(p,200);spawnFloatingText(o.x+12,o.y+12,'+200',textColor(p)||'#FFE866');playSfx('levelup');
      for(let k=0;k<16;k++) particles.push({x:o.x+12,y:o.y+12,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:25,maxLife:25,color:['#FF8C00','#FFC200','#FFE866','#FFF'][Math.floor(Math.random()*4)],size:4+Math.random()*4});
      solarOrbs.splice(i,1);
    }
  }

  // Bird pickup
  if(bird){
    bird.t+=dt; bird.x += bird.vx * dt; bird.y+=Math.sin(bird.t*0.05+bird.waveOff)*0.8*dt;
    if(bird.x<-30){ bird=null;birdUsed=true; }
    else {
      const p=players.find(q=>q.alive && collides(heroBox(q),bird));
      if(p){
        addScore(p,300);flowersActive=true;flowerTimer=0;bloomExistingPanels();
        spawnFloatingText(bird.x+11,bird.y,'+300',textColor(p)||'#FF88AA');
        for(let k=0;k<20;k++) particles.push({x:bird.x+11,y:bird.y+6,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:30,maxLife:30,color:['#FF88AA','#FFDD55','#FFB6C1','#FF69B4'][Math.floor(Math.random()*4)],size:3+Math.random()*4});
        bird=null;birdUsed=true;
      }
    }
  }

  // Enemy collision with heroes
  if(state==='playing'){
    players.forEach(p=>{
      if(!p.alive || p.invincible>0) return;
      const hB=heroBox(p);
      for(let i=enemies.length-1;i>=0;i--){
        if(collides(hB,enemies[i])){
          p.lives--;powerMeter=Math.max(0,powerMeter-2);sunBrightness=0.3;sunDimTimer=90;
          p.invincible=90;screenDim=Math.min(0.75,screenDim+0.35);playSfx('hit');
          spawnExplosion(p.x+48,p.y+24);enemies.splice(i,1);flashTimer=10;
          if(p.lives<=0){
            p.alive=false; p.triple=false; p.reviveBolts=0;
            spawnExplosion(p.x+30,p.y+20); spawnExplosion(p.x+70,p.y+30);
            if(players.some(q=>q.alive)) spawnFloatingText(W/2,200,PLAYER_STYLES[p.id].tag+' IS DOWN! GRAB 3 ⚡ TO REVIVE',PLAYER_STYLES[p.id].ui,150);
          }
          break;
        }
      }
    });
    if(players.every(q=>!q.alive)){ state='gameOver';stateTimer=0;stopMusic(); }
  }

  if(sunDimTimer>0){ sunDimTimer-=dt;sunBrightness=sunDimTimer<=0?1:0.3+0.7*(1-sunDimTimer/90); }
  for(let i=particles.length-1;i>=0;i--){ let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1); }
  for(let i=floatingTexts.length-1;i>=0;i--){ let ft=floatingTexts[i];ft.y+=ft.vy*dt;ft.life-=dt;if(ft.life<=0)floatingTexts.splice(i,1); }
  if(flashTimer>0) flashTimer-=dt;
}

function reviveTeammate(mate, rescuer){
  mate.alive=true; mate.lives=1; mate.reviveBolts=0; mate.invincible=150;
  mate.x=Math.max(5,Math.min(W-mate.w-5,rescuer.x-20));
  mate.y=rescuer.y<250 ? rescuer.y+90 : rescuer.y-90;
  mate.y=Math.max(5,Math.min(GROUND_Y-mate.h-20,mate.y));
  addScore(rescuer,250); playSfx('levelup');
  spawnFloatingText(W/2,170,PLAYER_STYLES[mate.id].tag+' IS BACK!  TEAMWORK +250',PLAYER_STYLES[rescuer.id].ui,120);
  for(let k=0;k<24;k++) particles.push({x:mate.x+48,y:mate.y+24,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:30,maxLife:30,color:[PLAYER_STYLES[mate.id].cape,PLAYER_STYLES[mate.id].skin,'#FFF'][Math.floor(Math.random()*3)],size:3+Math.random()*4});
}

// Which keys/controller drive which hero
function playerInput(pi){
  const k=(...c)=>c.some(x=>keys[x]);
  let inp, pad;
  if(numPlayers===1){
    inp={up:k('ArrowUp','KeyW'),down:k('ArrowDown','KeyS'),left:k('ArrowLeft','KeyA'),right:k('ArrowRight','KeyD'),fire:k('Space')};
    pad=padAll;                                  // any controller works in 1-player mode
  } else if(pi===0){
    inp={up:k('KeyW'),down:k('KeyS'),left:k('KeyA'),right:k('KeyD'),fire:k('Space','KeyF')};
    pad=padSlots[0];
  } else {
    inp={up:k('ArrowUp'),down:k('ArrowDown'),left:k('ArrowLeft'),right:k('ArrowRight'),fire:k('Enter','ShiftRight','Slash','Numpad0','KeyL')};
    pad=padSlots[1];
  }
  return { up:inp.up||pad.up, down:inp.down||pad.down, left:inp.left||pad.left, right:inp.right||pad.right, fire:inp.fire||pad.fire };
}

// ── GAME LOOP ──────────────────────────────────────────────────────────────────
// Fixed timestep at 60fps. dt=1.0 means exactly one 60fps frame has elapsed.
// Keeps gameplay speed consistent regardless of browser/device frame rate.
let lastTime = 0;

// ── Gamepad / controller support ─────────────────────────────────────────────
// Works with any USB or Bluetooth controller Chrome can see (Xbox, PlayStation,
// Switch-style, generic). Stick or D-pad moves, face buttons / triggers shoot,
// START (+) starts and confirms, SELECT (-) exits to title.
let padActive = false;          // true once a controller button/stick is used
let padCount = 0;               // controllers currently connected
const NAME_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ';
let padName = null;             // { slots: [...], idx: n } during controller name entry
let padRepeat = { dir: null, t: 0 };
function emptyPad(){ return { up:false, down:false, left:false, right:false, a:false, b:false, fire:false, start:false, select:false, any:false }; }
let padSlots = [emptyPad(), emptyPad()], padAll = emptyPad();          // this frame
let padEdgeSlots = [{}, {}], padEdgeAll = {};                          // newly pressed this frame

function readHat(v) {           // decode a D-pad reported as a single "hat" axis
  if (v === undefined || v > 1.05 || v < -1.05) return {};
  const dirs = [[-1,'up'],[-0.714,'upright'],[-0.428,'right'],[-0.143,'downright'],
                [0.143,'down'],[0.428,'downleft'],[0.714,'left'],[1,'upleft']];
  let best = null, bd = 9;
  for (const [val, name] of dirs) { const d = Math.abs(v - val); if (d < bd) { bd = d; best = name; } }
  if (bd > 0.1) return {};
  return { up: best.includes('up'), down: best.includes('down'),
           left: best.includes('left'), right: best.includes('right') };
}

function readPad(gp) {
  const out = emptyPad();
  const btn = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
  const ax = gp.axes || [];
  const DZ = 0.45;
  if ((ax[0] || 0) < -DZ) out.left = true;
  if ((ax[0] || 0) >  DZ) out.right = true;
  if ((ax[1] || 0) < -DZ) out.up = true;
  if ((ax[1] || 0) >  DZ) out.down = true;
  if (gp.mapping === 'standard') {
    if (btn(12)) out.up = true;   if (btn(13)) out.down = true;
    if (btn(14)) out.left = true; if (btn(15)) out.right = true;
  } else {
    const h = readHat(ax[9]);
    if (h.up) out.up = true; if (h.down) out.down = true;
    if (h.left) out.left = true; if (h.right) out.right = true;
  }
  // 8BitDo controllers connected to a Mac in D-input mode (SN30 Pro, Pro 2, etc.) report a
  // non-standard layout: A=0 B=1 X=3 Y=4 L1=6 R1=7 L2=8 R2=9 SELECT=10 START=11 HOME=12.
  const eightBitDo = gp.mapping !== 'standard' && /8bitdo|2dc8/i.test(gp.id || '');
  if (eightBitDo) {
    if (btn(0)) out.a = true;
    if (btn(1)) out.b = true;
    if (btn(0) || btn(1) || btn(3) || btn(4) || btn(7)) out.fire = true;
    if (btn(11)) out.start = true;
    if (btn(10)) out.select = true;
  } else {
    if (btn(0)) out.a = true;
    if (btn(1)) out.b = true;
    if (btn(0) || btn(1) || btn(2) || btn(3) || btn(5) || btn(7)) out.fire = true;
    if (btn(9)) out.start = true;
    if (btn(8)) out.select = true;
  }
  out.any = Object.keys(out).some(k => k !== 'any' && out[k]);
  return out;
}

function pollGamepads() {
  const list = navigator.getGamepads ? [...navigator.getGamepads()].filter(g => g && g.connected).sort((a, b) => a.index - b.index) : [];
  padCount = list.length;
  const states = list.map(readPad);
  const prevSlots = padSlots, prevAll = padAll;
  padSlots = [states[0] || emptyPad(), states[1] || emptyPad()];   // 1st controller = P1, 2nd = P2
  padAll = emptyPad();
  states.forEach(st => { for (const k in st) if (st[k]) padAll[k] = true; });
  const edges = (cur, prev) => { const e = {}; for (const k in cur) e[k] = cur[k] && !prev[k]; return e; };
  padEdgeAll = edges(padAll, prevAll);
  padEdgeSlots = [edges(padSlots[0], prevSlots[0]), edges(padSlots[1], prevSlots[1])];
  if (padAll.any) padActive = true;
  if (padEdgeAll.select) {
    document.dispatchEvent(new KeyboardEvent('keydown', { code: 'Escape' }));
    document.dispatchEvent(new KeyboardEvent('keyup', { code: 'Escape' }));
    padName = null;
  }
}
function padNav(){ const e = padEdgeAll; return !!(e.up || e.down || e.left || e.right); }
function padConfirm(){ return !!(padEdgeAll.a || padEdgeAll.start); }
function padSlotTouched(i){ const e = padEdgeSlots[i] || {}; return Object.keys(e).some(k => k !== 'any' && e[k]); }

// Arcade-style name entry with the controller (any controller can type)
function startPadName() {
  padName = { slots: ['A'], idx: 0 };
  playerName = 'A';
  nameInput.blur();
}
function padNameStep() {
  const n = padName, cur = padAll, ed = padEdgeAll;
  const cycle = d => {
    let i = NAME_CHARS.indexOf(n.slots[n.idx]);
    i = (i + d + NAME_CHARS.length) % NAME_CHARS.length;
    n.slots[n.idx] = NAME_CHARS[i];
  };
  const dir = cur.up ? 'up' : cur.down ? 'down' : null;
  if (dir) {
    if (padRepeat.dir !== dir) { padRepeat = { dir, t: performance.now() + 350 }; cycle(dir === 'up' ? 1 : -1); }
    else if (performance.now() > padRepeat.t) { padRepeat.t = performance.now() + 90; cycle(dir === 'up' ? 1 : -1); }
  } else padRepeat.dir = null;

  if (ed.right || ed.a) {
    if (n.slots.length >= 10) { finishPadName(); return; }
    n.idx++;
    if (n.idx >= n.slots.length) n.slots.push(n.slots[n.idx - 1]);
  }
  if (ed.left || ed.b) {
    if (n.idx > 0) { n.slots.pop(); n.idx = n.slots.length - 1; }
  }
  playerName = n.slots.join('').replace(/\s+$/,'');
  if (ed.start) finishPadName();
}
function finishPadName() {
  const nm = padName.slots.join('').trim().substring(0, 10);
  padName = null;
  confirmNameEntry(nm);
}
window.addEventListener('gamepadconnected', () => { padActive = true; });

// Unlock sound on the first click or key press (browsers block audio until then)
['click','keydown','touchstart'].forEach(ev =>
  window.addEventListener(ev, () => { try { getAudioCtx(); } catch (_) {} }, { once: true }));

function gameLoop(ts){
  const dt = lastTime ? Math.min((ts - lastTime) / (1000/60), 3) : 1;
  lastTime = ts;
  pollGamepads();
  update(dt);
  keyHit = {};
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
